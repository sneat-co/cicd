name: Nx CI (reusable)

# Reusable workflow: pnpm install + `nx run-many` over the given targets for an
# Nx workspace. Call from a consumer repo:
#
#   jobs:
#     frontend:
#       uses: sneat-co/cicd/.github/workflows/nx-ci.yml@main
#       with:
#         working-directory: frontend
#         targets: "lint build"
#         coverage-command: pnpm exec vitest run --coverage --coverage.reporter=lcov
#         minimum-coverage: 20
#         artifact-name: frontend-dist
#         artifact-paths: frontend/dist
#
# `extra-install-directory` installs a SECOND workspace before `nx run-many`.
# Needed when a project in the Nx graph is its own pnpm workspace (its own
# package.json + lockfile) nested inside the repo: the root install does not
# reach it, so a target that shells out to that workspace's binaries fails with
# a bare `<tool>: not found` and no hint that deps are the cause.
#
#         extra-install-directory: landings

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the Nx workspace (package.json / pnpm-lock.yaml)
        type: string
        required: false
        default: frontend
      extra-install-directory:
        description: >-
          Optional second directory to install deps in before running the
          targets — for a nested pnpm workspace that the root install does not
          reach (e.g. an Astro `landings/` beside an Nx app). Mirrors the input
          of the same name on cf-deploy.yml.
        type: string
        required: false
        default: ""
      targets:
        description: Space-separated Nx targets passed to `nx run-many -t`
        type: string
        required: false
        default: "lint test build"
      parallelism:
        description: >-
          Optional maximum number of Nx tasks to run concurrently. Zero keeps
          Nx's default parallelism.
        type: number
        required: false
        default: 0
      node-version:
        type: string
        required: false
        default: "22"
      pnpm-version:
        type: string
        required: false
        default: "11.20.0"
      timeout-minutes:
        type: number
        required: false
        default: 20
      coverage-command:
        description: >-
          Command that runs tests with coverage from working-directory. Required
          when minimum-coverage is greater than zero.
        type: string
        required: false
        default: ""
      coverage-path:
        description: LCOV file or directory containing lcov.info files, relative to working-directory
        type: string
        required: false
        default: coverage
      minimum-coverage:
        description: Minimum aggregate line coverage percentage (0 disables the check)
        type: number
        required: false
        default: 0
      coverage-artifact-name:
        description: Optional name used to upload the LCOV report
        type: string
        required: false
        default: ""
      artifact-name:
        description: Optional immutable build artifact name
        type: string
        required: false
        default: ""
      artifact-paths:
        description: >-
          Newline-separated repository-relative files/directories to package.
          Required when artifact-name is set.
        type: string
        required: false
        default: ""
      artifact-on-main-only:
        description: Upload the build artifact only for refs/heads/main
        type: boolean
        required: false
        default: true
      artifact-retention-days:
        description: Number of days to retain the build artifact
        type: number
        required: false
        default: 14
      peer-range-strict:
        description: >-
          Fail the job when a package we publish (@sneat/* or @sneat-team/*)
          declares a bare ^0.0.x/~0.0.x peerDependencies range, or an exact
          (no ^/~) pin outside 0.0.x. Defaults to false (report-only) while
          the fleet clears its existing violations; flip to true once this
          repo's @sneat/* peerDependencies use a union, an interval, a caret
          range, or an exact pin on a 0.0.x version instead.
        type: boolean
        required: false
        default: false
      check-zonejs:
        description: >-
          Fail the job when the pnpm dependency graph resolves zone.js.
          zone.js was eliminated fleet-wide on 2026-08-25 (backstage lesson
          L2026-08-25-2038): @angular/build picks its zone-based vs zoneless
          TEST strategy by probing whether zone.js is RESOLVABLE (including
          pnpm's .pnpm hoist mirror via NODE_PATH), not by reading config, so
          a single phantom optional-peer resolution of zone.js (an optional
          peer of @angular/core, @ionic/angular, @analogjs/vitest-angular)
          silently flips a zoneless suite back to zone-based and breaks it.
          Set to false only as a deliberate, reviewed opt-out.
        type: boolean
        required: false
        default: true

jobs:
  nx:
    name: lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # `continue-on-error` on THIS step cannot be a computed expression: on
      # 2026-09-02 we confirmed empirically that GitHub Actions ignores a
      # dynamic `continue-on-error: ${{ ... }}` on a step that itself `uses:`
      # a composite action -- the step's outcome (failure) still gets
      # reported as its conclusion (success), masking the violation
      # regardless of the input's actual value (a literal `continue-on-error:
      # true`/`false` on the same kind of step works correctly; only the
      # expression form on a composite-action step does not). So this step
      # always continues, and the next step does the real enforcement with a
      # plain `if:`, which is unaffected by that bug.
      - name: Reject bare ^0.0.x peer ranges / exact non-0.0.x peer pins on packages we publish
        id: peer-range-check
        uses: sneat-co/cicd/actions/check-peer-ranges@main
        continue-on-error: true
        with:
          directory: .

      - name: Enforce peer-range-strict
        if: steps.peer-range-check.outcome == 'failure' && inputs.peer-range-strict
        run: |
          echo "::error::check-peer-ranges found a violation (see the 'Reject bare ^0.0.x peer ranges / exact non-0.0.x peer pins on packages we publish' step above) and peer-range-strict is true, so this fails the job."
          exit 1

      - name: Setup pnpm + Node
        uses: sneat-co/cicd/actions/setup-pnpm-node@main
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}

      - name: Setup pnpm + Node (extra workspace)
        if: ${{ inputs.extra-install-directory != '' }}
        uses: sneat-co/cicd/actions/setup-pnpm-node@main
        with:
          working-directory: ${{ inputs.extra-install-directory }}
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}

      - name: Zone.js regression guard
        if: ${{ inputs.check-zonejs }}
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          # `pnpm why` always exits 0 whether or not the package resolves —
          # do not gate on exit code. Parse the --json array length instead:
          # empty ([]) means zone.js is not resolvable anywhere in the pnpm
          # graph, including the .pnpm hoist mirror; a non-empty array means
          # it is, which is exactly what makes @angular/build's zone-vs-
          # zoneless TEST-strategy probe pick zone-based and break a zoneless
          # suite. Confirmed empirically against a zone-free fleet repo
          # (empty array, exit 0) and a synthetic fixture depending on
          # zone.js (one-element array, exit 0).
          found="$(pnpm why -r zone.js --json | jq -r 'length')"
          if [[ "$found" -gt 0 ]]; then
            echo "::error::zone.js is resolvable in this pnpm dependency graph ($found match(es)). zone.js was eliminated fleet-wide on 2026-08-25 (backstage lesson L2026-08-25-2038). @angular/build picks its zone-based vs zoneless TEST strategy by probing whether zone.js is RESOLVABLE (including pnpm's .pnpm hoist mirror via NODE_PATH), not by reading config, so this breaks vitest's zoneless suites with an unresolvable 'await import(\"zone.js/testing\")' even when nothing in this repo depends on zone.js directly — zone.js is an optional peer of @angular/core, @ionic/angular, and @analogjs/vitest-angular, and pnpm's auto-install-peers installs unmet peers even when peerDependenciesMeta marks them optional (pnpm/pnpm#11155). Fix: add \`overrides: {\"zone.js\": \"-\"}\` to pnpm-workspace.yaml, PLUS the .pnpmfile.cjs readPackage hook that strips the zone.js peerDependencies/peerDependenciesMeta entries before pnpm's peer-resolution phase ever sees them (the override alone is not sufficient against pnpm/pnpm#11155). See backstage LESSONS-LEARNED.md L2026-08-25-2038. Set check-zonejs: false on this workflow only as a deliberate, reviewed opt-out."
            pnpm why -r zone.js
            exit 1
          fi
          echo "zone.js guard: clean — zone.js is not resolvable anywhere in the pnpm dependency graph."

      - name: Nx run-many
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          parallelism="${{ inputs.parallelism }}"
          if (( parallelism > 0 )); then
            pnpm exec nx run-many -t ${{ inputs.targets }} --parallel="$parallelism"
          else
            pnpm exec nx run-many -t ${{ inputs.targets }}
          fi

      - name: Require a coverage command when a threshold is configured
        if: ${{ inputs.minimum-coverage > 0 && inputs.coverage-command == '' }}
        run: |
          echo "::error::coverage-command is required when minimum-coverage is greater than zero"
          exit 1

      - name: Test with coverage
        if: ${{ inputs.minimum-coverage > 0 }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.coverage-command }}

      - name: Enforce test coverage threshold
        if: ${{ inputs.minimum-coverage > 0 }}
        uses: sneat-co/cicd/actions/check-lcov-coverage@main
        with:
          coverage-path: ${{ inputs.working-directory }}/${{ inputs.coverage-path }}
          minimum-percent: ${{ inputs.minimum-coverage }}

      - name: Upload coverage report
        if: ${{ inputs.minimum-coverage > 0 && inputs.coverage-artifact-name != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.coverage-artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.coverage-path }}
          if-no-files-found: error
          retention-days: 14

      - name: Package immutable build artifact
        if: ${{ inputs.artifact-name != '' && (!inputs.artifact-on-main-only || github.ref == 'refs/heads/main') }}
        uses: sneat-co/cicd/actions/package-build-artifact@main
        with:
          name: ${{ inputs.artifact-name }}
          paths: ${{ inputs.artifact-paths }}
          source-sha: ${{ github.sha }}
          retention-days: ${{ inputs.artifact-retention-days }}

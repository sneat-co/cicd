name: Go module tags (reusable)

# Reusable workflow: creates and pushes idempotent, validated annotated Git
# tags for one or more Go modules living in subdirectories of the calling
# repository, in the `<module-dir>/v<version>` shape Go uses to version a
# module that is not at the repository root
# (https://go.dev/ref/mod#vcs-version).
#
# The CALLER derives the {dir, version} pairs from its own consumed release
# version plans -- e.g. an Nx release version plan, where a family's version
# is shared lockstep between its npm package and its Go module -- and passes
# them explicitly. This workflow never guesses versions or scans the tree for
# changes: manual/implicit multi-module tagging is exactly the tag-vs-npm
# desync failure mode this workflow exists to prevent (see
# sneat-co/sneat-libs spec/features/ext-contracts-monorepo/README.md).
#
# Call from a consumer repo, after the step that decided what got released:
#
#   jobs:
#     tag-go-modules:
#       needs: release
#       permissions:
#         contents: write
#       uses: sneat-co/cicd/.github/workflows/go-module-tags.yml@main
#       with:
#         modules: |
#           [
#             {"dir": "contactus", "version": "1.4.0"},
#             {"dir": "taxus", "version": "0.3.1"}
#           ]
#       secrets:
#         app_id: ${{ vars.SNEAT_RELEASER_APP_ID }}
#         app_private_key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
#
# Authentication:
# - The calling job MUST grant `permissions: contents: write` -- this
#   workflow_call job's effective permissions are capped by whatever the
#   caller grants, regardless of what this workflow itself requests.
# - Creating a tag whose target commit changes files under `.github/workflows/`
#   is refused for an ordinary Actions token even when it otherwise has
#   `contents: write`. It needs the `workflows` permission.
# - Prefer the GitHub App: pass `app_id` + `app_private_key` and this workflow
#   mints a short-lived installation token scoped to the calling repository.
#   The Sneat Releaser App (id 4986653) was granted `Workflows: write` on
#   2026-09-18 for exactly this, on the founder's decision in sneat-co/cicd#38.
# - `git_token` remains accepted as a fallback for callers that have not been
#   migrated. It is a long-lived personal credential; an installation token is
#   minted per run and expires in an hour, so prefer the App.
# - With neither, `github.token` is used. That is sufficient for every release
#   commit that does not touch `.github/workflows/`, and fails loudly when one
#   does rather than tagging the wrong thing.
#
# Behavior:
# - Every {dir, version} pair is validated (go.mod exists at `dir` and its
#   `module` path equals `github.com/<owner>/<repo>/<dir>`) and checked
#   against any existing tag BEFORE any tag is created or pushed, so one bad
#   pair in a batch never leaves earlier pairs half-tagged.
# - Idempotent: re-running with a tag that already points at the target
#   commit succeeds with a notice. A tag that exists at a DIFFERENT commit
#   fails the run -- this workflow never moves a tag.
# - Every pushed (or already-correct) tag is re-verified with
#   `git ls-remote` against the calling repository before the job succeeds,
#   and the tag -> SHA table in the job summary is the authoritative receipt
#   for the run.

on:
  workflow_call:
    inputs:
      modules:
        description: >-
          JSON array of {"dir": "<module-dir>", "version": "<semver, no v
          prefix>"} pairs to tag. Required, non-empty. The caller derives
          these from its own consumed version plans -- this workflow never
          guesses versions or scans for changes itself.
        type: string
        required: true
      ref:
        description: >-
          Commit SHA to tag. Defaults to this workflow's github.sha.
        type: string
        required: false
        default: ""
    secrets:
      app_id:
        description: >-
          GitHub App id used to mint a short-lived installation token for
          checkout and tag pushes. Requires app_private_key. The App must hold
          `Workflows: write` to tag a commit that changes workflow files.
        required: false
      app_private_key:
        description: >-
          Private key for app_id. Passed as a secret so it is never exposed in
          a log. Requires app_id.
        required: false
      git_token:
        description: >-
          Deprecated fallback. Repository token used for checkout and tag
          pushes when no App credentials are supplied. It must be able to
          create refs whose target commit changes workflow files.
        required: false

permissions:
  contents: write

jobs:
  tag:
    name: Tag Go modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `secrets` context is not available in a step-level `if`, so presence
    # is resolved once here, at job level, where it is. These hold the strings
    # "true"/"false" and never the credential itself.
    env:
      APP_ID_PRESENT: ${{ secrets.app_id != '' }}
      APP_KEY_PRESENT: ${{ secrets.app_private_key != '' }}
    steps:
      # Both halves of the App credential must be present. Supplying one alone
      # is a configuration mistake that would otherwise degrade silently to the
      # PAT or github.token and only surface as a refused tag push much later,
      # on the rare release that touches a workflow file.
      - name: Check App credential completeness
        if: env.APP_ID_PRESENT != env.APP_KEY_PRESENT
        run: |
          echo '::error::app_id and app_private_key must be supplied together'
          exit 1

      - name: Mint installation token
        id: app-token
        if: env.APP_ID_PRESENT == 'true' && env.APP_KEY_PRESENT == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token || secrets.git_token || github.token }}
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Tag and push Go modules
        uses: sneat-co/cicd/actions/go-module-tags@895303a5328e2804bf022755f8441620e460eca3
        with:
          modules: ${{ inputs.modules }}
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

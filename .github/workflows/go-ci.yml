name: Go CI (reusable)

# Reusable workflow: lint (gofmt + go vet), test and build a Go module.
# Call from a consumer repo:
#
#   jobs:
#     backend:
#       uses: sneat-co/cicd/.github/workflows/go-ci.yml@main
#       with:
#         working-directory: backend

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing go.mod
        type: string
        required: false
        default: backend
      go-version-file:
        description: Path to the go.mod used to resolve the Go version
        type: string
        required: false
        default: ""
      gofmt:
        description: >-
          gofmt enforcement: 'error' fails the job on unformatted files,
          'warn' annotates them but passes, 'off' skips the check.
        type: string
        required: false
        default: error
      timeout-minutes:
        type: number
        required: false
        default: 15

jobs:
  go:
    name: lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.go-version-file != '' && inputs.go-version-file || format('{0}/go.mod', inputs.working-directory) }}
          # go.sum is absent for a dependency-free module, and setup-go fails
          # when no listed path resolves. go.mod always exists, so listing both
          # keeps the cache key precise where go.sum exists and still resolves
          # where it does not.
          cache-dependency-path: |
            ${{ inputs.working-directory }}/go.sum
            ${{ inputs.working-directory }}/go.mod

      # Module download is the one step in this workflow that depends on a
      # third-party service staying up for the duration of a job. A single
      # transient read from proxy.golang.org fails the whole job, and on
      # 2026-09-17 one such read — `stream error; INTERNAL_ERROR` fetching an
      # unrelated module — failed CI on main in sneat-ext-contracts and
      # silently cost a release, because both release workflows key on CI
      # concluding success.
      #
      # Downloading up front, with retries, separates "the network was briefly
      # unavailable" from "this code does not build". Later steps then resolve
      # from the warm module cache, so they no longer carry that risk. A module
      # with no dependencies downloads nothing and this is a fast no-op.
      - name: Download modules
        run: |
          set -uo pipefail
          attempt=1
          max=3
          until go mod download; do
            status=$?
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::go mod download failed after ${max} attempts (exit ${status})"
              exit "$status"
            fi
            delay=$((attempt * 5))
            echo "::warning::go mod download failed (exit ${status}); retrying in ${delay}s (attempt ${attempt}/${max})"
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      - name: Lint — gofmt
        if: ${{ inputs.gofmt != 'off' }}
        env:
          GOFMT_MODE: ${{ inputs.gofmt }}
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            if [ "$GOFMT_MODE" = "warn" ]; then
              echo "::warning::gofmt found unformatted files (non-blocking):"; echo "$unformatted"
            else
              echo "::error::gofmt found unformatted files:"; echo "$unformatted"; exit 1
            fi
          fi

      - name: Lint — go vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

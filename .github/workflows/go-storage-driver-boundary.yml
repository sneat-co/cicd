name: Go storage driver boundary (reusable)

# Focused adoption gate for repositories that still have unrelated findings
# under the complete dependency policy. This invokes the same WB scanner,
# policy resolver, type selection and classification as deps-policy.yml, then
# gates only centrally enforcing storage-driver imports. A green result here is
# not a green result for the full dependency policy.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the go.mod to check
        type: string
        required: false
        default: backend
      policy:
        description: >-
          Policy document to apply. Defaults to this repository's
          sneat-backend.yaml at the ref named by policy-ref.
        type: string
        required: false
        default: ""
      policy-ref:
        description: >-
          Ref of sneat-co/cicd used for the default policy and the checked
          boundary script.
        type: string
        required: false
        default: main
      native-sites:
        description: Check repository-wide classified native Firestore import sites
        type: boolean
        required: false
        default: false
      native-sites-manifest:
        description: Tracked manifest path relative to the target repository root
        type: string
        required: false
        default: ""
      native-sites-only:
        description: Explicit native-owner adoption without claiming dependency-layer validation
        type: boolean
        required: false
        default: false
      wb-version:
        description: Pinned WB CLI release to install.
        type: string
        required: false
        default: v0.37.0
      timeout-minutes:
        type: number
        required: false
        default: 10

permissions:
  contents: read

jobs:
  options:
    name: validate storage boundary options
    runs-on: ubuntu-latest
    steps:
      - name: Reject incomplete or contradictory opt-in
        env:
          NATIVE_SITES: ${{ inputs.native-sites }}
          NATIVE_ONLY: ${{ inputs.native-sites-only }}
          MANIFEST: ${{ inputs.native-sites-manifest }}
        run: |
          set -euo pipefail
          if [ "$NATIVE_SITES" = "true" ]; then
            test -n "$MANIFEST" || { echo "::error::native-sites requires a manifest path"; exit 1; }
          elif [ -n "$MANIFEST" ] || [ "$NATIVE_ONLY" = "true" ]; then
            echo "::error::manifest and native-sites-only require native-sites=true"
            exit 1
          fi
          if [ "$NATIVE_ONLY" = "true" ]; then
            echo "::notice::Native-site consistency only: dependency-layer validation is NOT run. Do not remove an existing required dependency gate."
          fi

  storage-boundary:
    needs: options
    if: ${{ !inputs.native-sites-only }}
    name: storage driver boundary (focused)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: source

      - name: Checkout boundary implementation
        uses: actions/checkout@v6
        with:
          repository: sneat-co/cicd
          ref: ${{ inputs.policy-ref }}
          path: .cicd
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ format('source/{0}/go.mod', inputs.working-directory) }}
          cache: false

      - name: Install wb
        env:
          WB_VERSION: ${{ inputs.wb-version }}
        run: go install github.com/sneat-dev/wb/cmd/wb@"$WB_VERSION"

      - name: Require a wb that actually has deps policy
        run: |
          if ! wb deps --help 2>&1 | grep -qw policy; then
            echo "::error title=wb too old::the installed wb has no 'deps policy' command."
            echo "Pin wb-version to a release containing it."
            wb deps --help || true
            exit 1
          fi

      - name: Resolve policy
        id: policy
        env:
          POLICY: ${{ inputs.policy }}
          POLICY_REF: ${{ inputs.policy-ref }}
        run: |
          if [ -n "$POLICY" ]; then
            echo "reference=$POLICY" >> "$GITHUB_OUTPUT"
          else
            echo "reference=https://raw.githubusercontent.com/sneat-co/cicd/${POLICY_REF}/policy/sneat-backend.yaml" >> "$GITHUB_OUTPUT"
          fi

      - name: Check focused storage-driver boundary
        working-directory: source/${{ inputs.working-directory }}
        env:
          POLICY: ${{ steps.policy.outputs.reference }}
        run: |
          "$GITHUB_WORKSPACE/.cicd/scripts/check-go-storage-driver-boundary.sh" . "$POLICY"

  native-sites:
    name: native Firestore import-site consistency
    needs: options
    if: ${{ inputs.native-sites }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout target source
        uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false
      - name: Checkout central boundary implementation
        uses: actions/checkout@v6
        with:
          repository: sneat-co/cicd
          ref: ${{ inputs.policy-ref }}
          path: .cicd
          persist-credentials: false
      - name: Record exact implementation and target revisions
        run: |
          git -C .cicd rev-parse HEAD
          git -C source rev-parse HEAD
      - name: Set up checker Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: .cicd/go.mod
          cache: false
      - name: Build trusted checker without target dependencies
        working-directory: .cicd
        env:
          GOWORK: 'off'
        run: go build -mod=readonly -o "$RUNNER_TEMP/check-go-native-firestore-sites" ./cmd/check-go-native-firestore-sites
      - name: Check native sites and record manifest digest
        env:
          MANIFEST: ${{ inputs.native-sites-manifest }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          "$RUNNER_TEMP/check-go-native-firestore-sites" --root "$GITHUB_WORKSPACE/source" --repository "$TARGET_REPOSITORY" --manifest "$MANIFEST"

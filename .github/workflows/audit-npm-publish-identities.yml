name: Audit npm publisher identities

# This organization-wide audit is intentionally manual. It needs the existing
# organization-read credential to prove the complete private repository owner
# set, so it must never become an unattended scheduled credential consumer.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Exact default-branch organization audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout audit provider
        uses: actions/checkout@v6

      - name: Read authoritative organization inventory
        env:
          GH_TOKEN: ${{ secrets.SNEAT_ORGANIZATION_AUDIT_TOKEN }}
        run: |
          node actions/check-npm-publish-identity/create-organization-inventory.mjs \
            --organization sneat-co \
            --archive-policy exclude \
            --output "$RUNNER_TEMP/npm-publish-organization-inventory.json"

      - name: Check out every recorded default-branch revision
        env:
          GH_TOKEN: ${{ secrets.SNEAT_ORGANIZATION_AUDIT_TOKEN }}
        run: |
          node actions/check-npm-publish-identity/checkout-organization-inventory.mjs \
            --inventory "$RUNNER_TEMP/npm-publish-organization-inventory.json" \
            --directory "$RUNNER_TEMP/sneat-co"

      - name: Audit authoritative package ownership
        env:
          SNEAT_ORGANIZATION_AUDIT_TOKEN: ${{ secrets.SNEAT_ORGANIZATION_AUDIT_TOKEN }}
        run: |
          node actions/check-npm-publish-identity/audit.mjs \
            --organization sneat-co \
            --organization-root "$RUNNER_TEMP/sneat-co" \
            --github-api \
            --require-authoritative \
            --require-unique-owners

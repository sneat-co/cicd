name: Validate shared CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions:
    name: Artifact, coverage, SPA and Go-tag action tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run action tests
        run: tests/test-build-artifact-actions.sh

      - name: Run peer-range check tests
        run: tests/test-check-peer-ranges.sh

      - name: Run go-module-tags tests
        run: tests/test-go-module-tags.sh

      - name: Run NPM publisher identity tests
        run: tests/test-npm-publish-identity.sh

      - name: Run NPM publisher structural audit tests
        run: bash tests/test-npm-publish-audit-structural.sh

      - name: Run NPM publisher JSON safety tests
        run: node tests/test-npm-publish-json-safety.mjs

      - name: Run NPM publisher redaction tests
        run: bash tests/test-npm-publish-redaction.sh

      - name: Run NPM publisher authority tests
        run: bash tests/test-npm-publish-authority.sh

  go:
    name: Go CI
    uses: ./.github/workflows/go-ci.yml
    with:
      working-directory: .

name: Validate shared CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions:
    name: Artifact, coverage, SPA and Go-tag action tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run action tests
        run: tests/test-build-artifact-actions.sh

      - name: Run peer-range check tests
        run: tests/test-check-peer-ranges.sh

      - name: Run go-module-tags tests
        run: tests/test-go-module-tags.sh

  go:
    name: Go CI
    uses: ./.github/workflows/go-ci.yml
    with:
      working-directory: .

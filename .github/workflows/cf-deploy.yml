name: Cloudflare Deploy (reusable)

# Reusable workflow: build a project and deploy it to Cloudflare (Workers static
# assets) with wrangler. Implements the "Sharing & reuse" decision in backstage
# spec/features/site-hosting-pattern.
#
# Supports three build shapes via `build-command` (falls back to Nx for back-compat):
#
#   # 1) Nx app (original behaviour — unchanged for existing callers)
#   with: { working-directory: frontend, build-target: gameboard-app }
#
#   # 2) Pure Astro landing
#   with: { working-directory: landings, build-command: pnpm exec astro build }
#
#   # 3) Astro landing + root-mounted Angular app (assembled into one dist/)
#   with:
#     working-directory: landings
#     build-command: pnpm build            # astro build && build:app && assemble
#     extra-install-directory: .           # also install the repo-root Nx workspace
#
# Optional: `smoke-command` runs after a successful deploy (post-deploy smoke).
#
# Optional: `setup-tinygo: true` installs TinyGo before the build, for callers
# whose build compiles Go to WebAssembly with it (e.g. chess's chesswasm).
# Off by default — installing a toolchain most callers never touch would slow
# every deploy for one repo's benefit.
#
# Optional: `goprivate` + the `GOPRIVATE_TOKEN` secret authenticate a build
# that needs to `go get`/`go list` a private GitHub repo (e.g. chess's wasm
# build reaching a private module). Both are optional and independent of
# setup-tinygo; when either is omitted, no credential rewrite happens and
# GOPRIVATE is left empty — byte-identical to today's behaviour. `goprivate`
# is expected in Go's own `github.com/<org>` form; only its first
# comma-separated entry is used to derive the credential-rewrite prefix.
#
# Call from a consumer repo (auth: org-level CLOUDFLARE_API_TOKEN secret +
# CLOUDFLARE_ACCOUNT_ID org variable — the account id is an identifier, not a
# secret):
#   jobs:
#     deploy:
#       uses: sneat-co/cicd/.github/workflows/cf-deploy.yml@main
#       with:
#         working-directory: landings
#         build-command: pnpm build
#         cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
#       secrets:
#         CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
#
#   # ...plus, only for a build that reaches a private GitHub Go module:
#   jobs:
#     deploy:
#       uses: sneat-co/cicd/.github/workflows/cf-deploy.yml@main
#       with:
#         setup-tinygo: true
#         goprivate: github.com/sneat-co
#         cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
#       secrets:
#         CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
#         GOPRIVATE_TOKEN: ${{ secrets.SNEAT_CI_READWRITE_TOKEN }}

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to build + deploy from (has its own package.json / lockfile)
        type: string
        required: false
        default: frontend
      build-command:
        description: >-
          Shell command to build (run in working-directory). When empty, falls
          back to `pnpm exec nx build <build-target>`.
        type: string
        required: false
        default: ""
      build-target:
        description: Nx app to build when build-command is empty (`pnpm exec nx build <target>`)
        type: string
        required: false
        default: ""
      extra-install-directory:
        description: >-
          Optional second directory to install deps in before building (e.g. the
          repo-root Nx workspace for landings that assemble a root-mounted app).
        type: string
        required: false
        default: ""
      cloudflare-account-id:
        description: >-
          Cloudflare account ID (an identifier, not a secret — it appears in
          dashboard URLs). Callers pass it from an org/repo variable via this
          input. When empty, falls back to the CLOUDFLARE_ACCOUNT_ID secret for
          back-compat.
        type: string
        required: false
        default: ""
      wrangler-config:
        description: Path to the wrangler config, relative to working-directory
        type: string
        required: false
        default: wrangler.jsonc
      smoke-command:
        description: >-
          Optional post-deploy smoke command run in working-directory after a
          successful deploy (e.g. `node scripts/post-deploy-smoke.mjs
          https://example.com`). Fails the job if it exits non-zero.
        type: string
        required: false
        default: ""
      setup-tinygo:
        description: >-
          Install TinyGo before the build, for callers whose build compiles Go
          to WebAssembly with it. Off by default so most callers pay nothing
          for a toolchain they never use.
        type: boolean
        required: false
        default: false
      tinygo-version:
        description: >-
          TinyGo version to install when setup-tinygo is true. Pinned, not
          latest, so a TinyGo release can't silently change every caller's
          wasm output.
        type: string
        required: false
        default: "0.41.1"
      goprivate:
        description: >-
          GOPRIVATE value for a build that needs to reach a private Go
          module (e.g. a private GitHub repo). Empty by default so existing
          callers are unaffected. Only takes effect together with the
          GOPRIVATE_TOKEN secret — supplying just one of the two is a no-op.
          Expected in Go's `github.com/<org>` form; when it contains a
          comma-separated list, only the first entry is used to derive the
          git credential-rewrite prefix.
        type: string
        required: false
        default: ""
      node-version:
        type: string
        required: false
        default: "22"
      pnpm-version:
        type: string
        required: false
        default: "11.20.0"
      timeout-minutes:
        type: number
        required: false
        default: 20
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        # Optional / legacy: prefer the `cloudflare-account-id` input fed from a
        # VARIABLE. Kept for back-compat with callers that still pass it here.
        required: false
      PRIMEUI_LICENSE:
        # Optional build-time licence used by PrimeUI applications. Callers
        # without PrimeUI remain unchanged.
        required: false
      GOPRIVATE_TOKEN:
        # Optional GitHub token (repo scope) for a build that needs
        # `git`/`go` to authenticate against a private GitHub repo behind
        # the `goprivate` input. Callers without private Go modules remain
        # unchanged.
        required: false

jobs:
  deploy:
    name: build · deploy
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm + Node (build workspace)
        uses: sneat-co/cicd/actions/setup-pnpm-node@main
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}

      - name: Setup pnpm + Node (extra workspace)
        if: ${{ inputs.extra-install-directory != '' }}
        uses: sneat-co/cicd/actions/setup-pnpm-node@main
        with:
          working-directory: ${{ inputs.extra-install-directory }}
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}

      # Installed from the official .deb rather than a marketplace action on
      # purpose: a new `uses:` has to clear the org action allowlist, and
      # lesson L53 records that a non-allowlisted action fails at startup with
      # no diagnosis. Gated on setup-tinygo so callers that don't build wasm
      # never pay for it.
      - name: Install TinyGo
        if: ${{ inputs.setup-tinygo }}
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/tinygo.deb" \
            "https://github.com/tinygo-org/tinygo/releases/download/v${{ inputs.tinygo-version }}/tinygo_${{ inputs.tinygo-version }}_amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/tinygo.deb"
          tinygo version

      # Gated on goprivate alone: the `secrets` context isn't allowed in a
      # step `if:` (only env/github/inputs/job/matrix/needs/runner/steps/
      # strategy/vars are — actionlint catches the alternative), so the
      # token-presence check happens at runtime below instead. Net effect
      # is still a no-op unless BOTH are supplied: nothing to rewrite
      # without a prefix, and a token with no prefix has no matching
      # `goprivate` to gate on in the first place. Must run before Build,
      # since `go`/`git` resolve modules during that step.
      #
      # H1-adjacent hardening: thread the secret through `env:` rather than
      # interpolating it directly into the `run:` script text — `${{ }}`
      # substitution happens before bash ever parses the line, so a value
      # embedded this way is one `set -x`/process-listing away from leaking,
      # whereas an env var is masked in logs and only ever read as data.
      - name: Configure git credentials for private Go modules
        if: ${{ inputs.goprivate != '' }}
        env:
          GOPRIVATE_TOKEN: ${{ secrets.GOPRIVATE_TOKEN }}
          GOPRIVATE_PREFIX: ${{ inputs.goprivate }}
        run: |
          if [ -z "$GOPRIVATE_TOKEN" ]; then
            echo "goprivate is set but the GOPRIVATE_TOKEN secret is empty — skipping the git credential rewrite (nothing to authenticate with)."
            exit 0
          fi
          # GOPRIVATE can be a comma-separated list of glob patterns; the
          # credential rewrite only supports one prefix, so take the first
          # entry and drop a trailing "/*" glob suffix — git's insteadOf
          # does a literal prefix match, not a glob match.
          prefix="${GOPRIVATE_PREFIX%%,*}"
          prefix="${prefix%/\*}"
          git config --global url."https://${GOPRIVATE_TOKEN}:x-oauth-basic@${prefix}".insteadOf "https://${prefix}"

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        env:
          PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
          GOPRIVATE: ${{ inputs.goprivate }}
        run: ${{ inputs.build-command || format('pnpm exec nx build {0}', inputs.build-target) }}

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ inputs.cloudflare-account-id != '' && inputs.cloudflare-account-id || secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory }}
          command: deploy --config ${{ inputs.wrangler-config }}

      - name: Post-deploy smoke test
        if: ${{ inputs.smoke-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.smoke-command }}
